# CloudSentry local stack:  docker compose up --build
#   Dashboard        http://localhost:3000
#   API via LB       http://localhost:8080   (Swagger: http://localhost:8080/docs)
#   API-01 / API-02  http://localhost:8001 / http://localhost:8002 (direct, for debugging)
# Defaults below are for LOCAL DEMO ONLY. Override them in a root .env file (see .env.example).
name: cloudsentry

x-api-env: &api-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-cloudsentry}:${POSTGRES_PASSWORD:-cloudsentry_dev}@db:5432/${POSTGRES_DB:-cloudsentry}
  JWT_SECRET: ${JWT_SECRET:-local-demo-jwt-secret-change-me-before-deploying}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@CloudSentry1}
  SEED_ANALYST_PASSWORD: ${SEED_ANALYST_PASSWORD:-Analyst@CloudSentry1}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  EXPECTED_INSTANCES: API-01,API-02
  PORT: "8000"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudsentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudsentry_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cloudsentry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudsentry} -d ${POSTGRES_DB:-cloudsentry}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api1:
    build: ./backend
    environment:
      <<: *api-env
      INSTANCE_ID: API-01
    depends_on:
      db: { condition: service_healthy }
    ports: ["8001:8000"]

  api2:
    build: ./backend
    environment:
      <<: *api-env
      INSTANCE_ID: API-02
    depends_on:
      db: { condition: service_healthy }
      api1: { condition: service_healthy }   # api1 creates tables/seed data first
    ports: ["8002:8000"]

  lb:
    build: ./lb
    environment:
      LB_MODE: internal
      UPSTREAM_1: api1:8000
      UPSTREAM_2: api2:8000
      PORT: "80"
    depends_on:
      api1: { condition: service_healthy }
      api2: { condition: service_healthy }
    ports: ["8080:80"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on: [lb]
    ports: ["3000:80"]

volumes:
  pgdata:
